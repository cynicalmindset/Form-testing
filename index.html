<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netlify Form Test</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 60px auto; padding: 20px; }
    form { display: grid; gap: 14px; }
    input, textarea, button { padding: 12px; font-size: 16px; }
    button { cursor: pointer; }
  </style>

  <h1>Netlify Form Test</h1>
  <p>Submit this form to test the Workik Netlify "New Form Submission" trigger.</p>

  <form name="contact" method="POST" data-netlify="true" action="/success.html">
    <input type="hidden" name="form-name" value="contact">

    <label>
      Name<br>
      <input type="text" name="name" placeholder="Yash" required>
    </label>

    <label>
      Email<br>
      <input type="email" name="email" placeholder="test@example.com" required>
    </label>

    <label>
      Message<br>
      <textarea name="message" placeholder="Testing Workik + Netlify"></textarea>
    </label>
